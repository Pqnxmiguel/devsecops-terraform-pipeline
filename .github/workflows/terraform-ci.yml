name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ============================================================
  # JOB 1: Terraform format, validate & plan
  # ============================================================
  terraform-check:
    name: Terraform Format, Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ============================================================
  # JOB 2: SAST - Checkov (independiente)
  # ============================================================
  sast-checkov:
    name: SAST - Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true
          # CKV2_AWS_62/61 y CKV_AWS_144/145 son "graph checks": Checkov no
          # soporta suprimirlos con comentarios inline (#checkov:skip), ver infra/main.tf.
          skip_check: CKV2_AWS_62,CKV2_AWS_61,CKV_AWS_144,CKV_AWS_145

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Count Checkov findings
        id: count
        run: |
          FAILED=$(jq '[.runs[].results[]] | length' checkov-results.sarif)
          echo "Checkov encontró $FAILED hallazgos"
          echo "issues=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Fail if Checkov found issues
        if: steps.count.outputs.issues != '0'
        run: |
          echo "❌ Checkov detectó ${{ steps.count.outputs.issues }} configuraciones inseguras."
          exit 1

  # ============================================================
  # JOB 3: SAST - tfsec (independiente)
  # ============================================================
  sast-tfsec:
    name: SAST - tfsec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -sSL -o tfsec https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec

      - name: Run tfsec
        id: tfsec
        run: |
          tfsec infra --format sarif --out tfsec-results.sarif --soft-fail
          ISSUES=$(jq '.runs[0].results | length' tfsec-results.sarif)
          echo "tfsec encontró $ISSUES hallazgos"
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"

      # tfsec reporta rutas relativas a "infra" (ej. "main.tf"); GitHub necesita
      # rutas relativas a la raiz del repo (ej. "infra/main.tf") para poder
      # anotar los hallazgos sobre el diff del PR.
      - name: Normalizar rutas del SARIF
        run: |
          jq '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= "infra/" + .' tfsec-results.sarif > tfsec-results.sarif.tmp
          mv tfsec-results.sarif.tmp tfsec-results.sarif

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      - name: Fail if tfsec found issues
        if: steps.tfsec.outputs.issues != '0'
        run: |
          echo "❌ tfsec detectó ${{ steps.tfsec.outputs.issues }} configuraciones inseguras."
          exit 1

  # ============================================================
  # JOB 4: SAST - Trivy (independiente)
  # ============================================================
  sast-trivy:
    name: SAST - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy (Terraform config scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      # Igual que en tfsec: Trivy reporta rutas relativas a "infra" (ej. "main.tf");
      # las normalizamos a rutas relativas a la raiz del repo para que GitHub
      # pueda anotar los hallazgos sobre el diff del PR.
      - name: Normalizar rutas del SARIF
        run: |
          jq '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= "infra/" + .' trivy-results.sarif > trivy-results.sarif.tmp
          mv trivy-results.sarif.tmp trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Count Trivy findings
        id: count
        run: |
          ISSUES=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          echo "Trivy encontró $ISSUES hallazgos"
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"

      - name: Fail if Trivy found issues
        if: steps.count.outputs.issues != '0'
        run: |
          echo "❌ Trivy detectó ${{ steps.count.outputs.issues }} configuraciones inseguras."
          exit 1

  # ============================================================
  # JOB 5: Notificacion a Discord (#security-alerts)
  # ============================================================
  notify-discord:
    name: Notificar a Discord
    runs-on: ubuntu-latest
    needs: [terraform-check, sast-checkov, sast-tfsec, sast-trivy]
    if: always()

    steps:
      - name: Enviar notificacion
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.BOTDEVSEC }}
          RESULT_PLAN: ${{ needs.terraform-check.result }}
          RESULT_CHECKOV: ${{ needs.sast-checkov.result }}
          RESULT_TFSEC: ${{ needs.sast-tfsec.result }}
          RESULT_TRIVY: ${{ needs.sast-trivy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "BOTDEVSEC no esta configurado, se omite la notificacion."
            exit 0
          fi

          if [[ "$RESULT_PLAN $RESULT_CHECKOV $RESULT_TFSEC $RESULT_TRIVY" == *"failure"* ]]; then
            COLOR=15158332
            TITLE="🚨 Se detectaron hallazgos de seguridad"
          else
            COLOR=3066993
            TITLE="✅ Pipeline limpio - sin hallazgos"
          fi

          DESCRIPTION="**Repo:** ${REPO}"$'\n'"**Rama:** ${REF}"
          if [ -n "$PR_URL" ]; then
            DESCRIPTION="${DESCRIPTION}"$'\n'"**PR:** ${PR_URL}"
          fi

          PAYLOAD=$(jq -n \
            --arg username "DEVSEC" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --argjson color "$COLOR" \
            --arg plan "$RESULT_PLAN" \
            --arg checkov "$RESULT_CHECKOV" \
            --arg tfsec "$RESULT_TFSEC" \
            --arg trivy "$RESULT_TRIVY" \
            --arg url "$RUN_URL" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                description: $description,
                color: $color,
                url: $url,
                fields: [
                  {name: "Terraform Plan", value: $plan, inline: true},
                  {name: "Checkov", value: $checkov, inline: true},
                  {name: "tfsec", value: $tfsec, inline: true},
                  {name: "Trivy", value: $trivy, inline: true}
                ]
              }]
            }')

          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"