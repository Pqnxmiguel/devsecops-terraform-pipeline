name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  terraform-check:
    name: Terraform Format, Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  security-scan:
    name: SAST - Checkov, tfsec & Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- CHECKOV ---
      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false
        continue-on-error: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      # --- TFSEC ---
      - name: Install tfsec
        run: |
          curl -sSL -o tfsec https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec

      - name: Run tfsec
        id: tfsec
        run: |
          tfsec infra --format sarif --out tfsec-results.sarif --soft-fail
          ISSUES=$(jq '.runs[0].results | length' tfsec-results.sarif)
          echo "Se encontraron $ISSUES hallazgos con tfsec"
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      # --- TRIVY (refuerzo, mejor integración con Code Scanning) ---
      - name: Run Trivy (Terraform config scan)
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # --- BLOQUEO: si Checkov, tfsec o Trivy detectaron fallas, el job falla ---
      - name: Count Trivy findings
        id: trivy_count
        if: always()
        run: |
          if [ -f trivy-results.sarif ]; then
            TRIVY_ISSUES=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          else
            TRIVY_ISSUES=0
          fi
          echo "Trivy encontró $TRIVY_ISSUES hallazgos"
          echo "issues=$TRIVY_ISSUES" >> "$GITHUB_OUTPUT"

      - name: Fail job if security issues were found
        if: steps.checkov.outcome == 'failure' || steps.tfsec.outputs.issues != '0' || steps.trivy_count.outputs.issues != '0'
        run: |
          echo "❌ Se detectaron configuraciones inseguras (Checkov, tfsec y/o Trivy)."
          echo "   Revisa los comentarios en 'Files changed' y la pestaña Security del repo."
          exit 1